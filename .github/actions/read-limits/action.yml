name: Read resource limits
description: >
  Read the container's effective CPU and memory limits from cgroup v2
  (with cgroup v1 fallback). Shared by every e2e workflow so the detection
  logic lives in one place.
outputs:
  cpus:
    description: CPU limit with one decimal, e.g. "4.0" (falls back to nproc when unlimited)
    value: ${{ steps.limits.outputs.cpus }}
  mem_gb:
    description: Memory limit in GB with one decimal, e.g. "8.0"; "unlimited" or "unknown" when not set
    value: ${{ steps.limits.outputs.mem_gb }}
  mem_display:
    description: Memory limit for display, e.g. "8.0 GB", "unlimited", or "unknown"
    value: ${{ steps.limits.outputs.mem_display }}
runs:
  using: composite
  steps:
    - id: limits
      shell: bash
      run: |
        # CPU limit
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          read QUOTA PERIOD < /sys/fs/cgroup/cpu.max
          if [ "$QUOTA" != "max" ]; then
            CPUS=$(awk "BEGIN {printf \"%.1f\", $QUOTA / $PERIOD}")
          else
            CPUS="$(nproc).0"
          fi
        elif [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
          QUOTA=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
          PERIOD=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
          if [ "$QUOTA" != "-1" ]; then
            CPUS=$(awk "BEGIN {printf \"%.1f\", $QUOTA / $PERIOD}")
          else
            CPUS="$(nproc).0"
          fi
        else
          CPUS="$(nproc).0"
        fi

        # Memory limit
        MEM_BYTES=""
        if [ -f /sys/fs/cgroup/memory.max ]; then
          MEM_BYTES=$(cat /sys/fs/cgroup/memory.max)
        elif [ -f /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
          MEM_BYTES=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
        fi

        if [ -z "$MEM_BYTES" ]; then
          MEM_GB="unknown"
          MEM_DISPLAY="unknown"
        elif [ "$MEM_BYTES" = "max" ]; then
          MEM_GB="unlimited"
          MEM_DISPLAY="unlimited"
        else
          MEM_GB=$(awk "BEGIN {printf \"%.1f\", $MEM_BYTES / 1073741824}")
          MEM_DISPLAY="${MEM_GB} GB"
        fi

        echo "cpus=$CPUS" >> "$GITHUB_OUTPUT"
        echo "mem_gb=$MEM_GB" >> "$GITHUB_OUTPUT"
        echo "mem_display=$MEM_DISPLAY" >> "$GITHUB_OUTPUT"
        echo "Limits: CPUs=$CPUS Memory=$MEM_DISPLAY"
